<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 검색엔진 노출 차단: 지우지 말 것 -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>프로젝트 | 맹민지 AX 포트폴리오</title>
  <link rel="icon" href="images/common/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="images/common/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="images/common/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Playfair+Display:ital@1&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/project.css" />
</head>
<body>
  <!-- project.html?id=cosmoa 처럼 열면 js/project.js가 해당 프로젝트를 채운다 -->
  <div class="p-bar">
    <div class="wrap">
      <a class="back" href="index.html">← 목록</a>
      <nav class="p-nav" aria-label="섹션 바로가기">
        <a href="#p-map">요약</a><a href="#p-story">스토리</a><a href="#p-mine">담당</a><a href="#p-features">기능</a>
      </nav>
    </div>
  </div>
  <header id="p-cover"></header>        <!-- 1. 번호, 제목, 부제, 대표 이미지 -->
  <section id="p-map"></section>        <!-- 2. 한눈에 보기: 마인드맵 + 명세 -->
  <section id="p-story"></section>      <!-- 3. 문제 → 접근 → 결과 + 실무 과제 → 대응 -->
  <section id="p-timeline"></section>   <!-- 3-1. 진행 과정 (timeline 있을 때만) -->
  <section id="p-mine"></section>       <!-- 4. 내가 맡은 부분 -->
  <section id="p-features"></section>   <!-- 5. 기능 + 기술 스택 (누르면 기능 설명 창) -->
  <section id="p-gallery"></section>    <!-- 6. 결과물 + 크게 보기 -->
  <section id="p-links"></section>      <!-- 6. 링크 버튼 -->
  <nav id="p-next" aria-label="다음 프로젝트"></nav>  <!-- 다음 프로젝트 폴더 -->

  <!-- 결과물 크게 보기 (흰 반투명 배경) -->
  <dialog class="lightbox" id="lightbox" aria-label="크게 보기">
    <button class="lb-close" type="button" aria-label="닫기">×</button>
    <figure><img alt="" /><figcaption></figcaption></figure>
  </dialog>

  <!-- 기능 크게 보기: 화면 + 탭 설명 (js/project.js가 채움) -->
  <dialog class="feature-modal" id="feature-modal" aria-label="기능 자세히 보기">
    <div class="fm-card">
      <button class="lb-close" type="button" aria-label="닫기">×</button>
      <div class="fm-body"></div>
      <div class="fm-nav">
        <button class="btn fm-prev" type="button">← 이전 기능</button>
        <button class="btn fm-next" type="button">다음 기능 →</button>
      </div>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
